<!doctype html>
<html lang="en">
  <head>
    <title>1350 AR Model</title>
    <meta charset="utf-8" />
    <meta name="description" content="<model-viewer> AR template" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- Styles -->
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: Arial, sans-serif;
      }

      model-viewer {
        width: 100%;
        height: 100vh;
        background-color: #fff;
      }

      #ar-button {
        background-color: #4285f4;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 12px 20px;
        font-size: 16px;
        cursor: pointer;
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
      }

      #ar-button:active {
        background-color: #3367d6;
      }

      #ar-prompt {
        position: absolute;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
      }

      #ar-prompt img {
        height: 50px;
        opacity: 0.8;
      }

      .progress-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 5px;
        width: 100%;
        background-color: rgba(0, 0, 0, 0.1);
        z-index: 10;
      }

      .update-bar {
        height: 100%;
        width: 0%;
        background-color: #4285f4;
        transition: width 0.3s;
      }

      .hide {
        display: none;
      }
    </style>
  </head>

  <body>
    <!-- AR Model Viewer -->
    <model-viewer
      src="1350_without_Canopy.glb"
      ar
      ar-modes="webxr scene-viewer quick-look"
      camera-controls
      tone-mapping="neutral"
      shadow-intensity="1"
      camera-orbit="-236.2deg 65.57deg 0.4708m"
      field-of-view="30deg"
      alt="3D model of 1350"
    >
      <!-- Progress bar -->
      <div class="progress-bar" slot="progress-bar">
        <div class="update-bar" id="update-bar"></div>
      </div>

      <!-- AR button -->
      <button slot="ar-button" id="ar-button">View in your space</button>

      <!-- AR prompt -->
      <!-- <div id="ar-prompt">
        <img src="ar_hand_prompt.png" alt="Move phone to view in AR" />
      </div> -->
    </model-viewer>

    <!-- Script to handle progress -->
    <script>
      const modelViewer = document.querySelector("model-viewer");
      const progressBar = document.querySelector(".progress-bar");
      const updateBar = document.getElementById("update-bar");

      modelViewer.addEventListener("progress", (event) => {
        const progress = event.detail.totalProgress;
        updateBar.style.width = `${progress * 100}%`;

        if (progress === 1) {
          progressBar.classList.add("hide");
        } else {
          progressBar.classList.remove("hide");
        }
      });
    </script>

    <!-- Load model-viewer -->
    <script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
  </body>
</html>
