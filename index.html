<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Model Viewer</title>
    <style>
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      .model-container {
        position: relative;
        height: 500px;
        width: 100%;
        background-color: #f5f5f5;
        border-radius: 8px;
        overflow: hidden;
      }

      #model-viewer {
        width: 100%;
        height: 100%;
      }

      #loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(255, 255, 255, 0.8);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(0, 0, 0, 0.1);
        border-radius: 50%;
        border-top-color: #3498db;
        animation: spin 1s ease-in-out infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .hide {
        display: none !important;
      }

      .progress-bar {
        width: 100%;
        height: 10px;
        background-color: rgba(0, 0, 0, 0.1);
        border-radius: 5px;
        overflow: hidden;
        margin-top: 10px;
      }

      .update-bar {
        height: 100%;
        background-color: #3498db;
        width: 0%;
        transition: width 0.2s;
      }

      #ar-button {
        background-color: #4285f4;
        border: none;
        border-radius: 4px;
        color: white;
        padding: 10px 16px;
        font-size: 14px;
        cursor: pointer;
        margin-top: 10px;
      }

      #ar-prompt {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        width: 100px;
        height: 100px;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="model-container">
        <!-- Loading overlay -->
        <div id="loading-overlay">
          <div class="spinner"></div>
        </div>

        <!-- <model-viewer> HTML element -->
        <model-viewer
          id="model-viewer"
          src="1350.glb"
          alt="3D model"
          ar
          ar-modes="webxr scene-viewer quick-look"
          ar-scale="auto"
          camera-controls
          environment-image="neutral"
          tone-mapping="neutral"
          shadow-intensity="1"
          exposure="0.5"
          auto-rotate
          ios-src="1700.usdz"
        >
          <div class="progress-bar hide" slot="progress-bar">
            <div class="update-bar"></div>
          </div>
          <button slot="ar-button" id="ar-button">View in your space</button>
          <div id="ar-prompt">
            <img src="ar_hand_prompt.png" />
          </div>
        </model-viewer>
      </div>

      <div style="margin-top: 20px">
        <p id="ar-status">AR not available on this device or browser</p>
      </div>
    </div>

    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"
    ></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Get the elements
        const modelViewer = document.getElementById("model-viewer");
        const loadingOverlay = document.getElementById("loading-overlay");
        const progressBar = document.querySelector(".update-bar");
        const arStatus = document.getElementById("ar-status");

        // Check if AR is supported
        if (modelViewer) {
          // Update the AR status message based on browser support
          if (window.WebXRPolyfill) {
            arStatus.textContent = "AR supported through polyfill";
          } else if ("xr" in navigator) {
            navigator.xr
              .isSessionSupported("immersive-ar")
              .then((supported) => {
                if (supported) {
                  arStatus.textContent = "WebXR AR supported on this device!";
                } else {
                  arStatus.textContent =
                    "WebXR supported, but AR not available on this device";
                }
              })
              .catch(() => {
                arStatus.textContent = "Error checking AR support";
              });
          } else if (/(Android|iPhone|iPad)/i.test(navigator.userAgent)) {
            arStatus.textContent =
              "AR may be supported through Scene Viewer or Quick Look";
          } else {
            arStatus.textContent = "AR not supported on this device/browser";
          }
        }

        // Hide loading overlay when model is loaded
        modelViewer.addEventListener("load", () => {
          loadingOverlay.classList.add("hide");
        });

        // Also listen for the 'model-visibility' event which might be more reliable
        modelViewer.addEventListener("model-visibility", (event) => {
          if (event.detail.visible) {
            loadingOverlay.classList.add("hide");
          }
        });

        // Show loading progress
        modelViewer.addEventListener("progress", (event) => {
          const progressPercent = event.detail.totalProgress * 100;
          progressBar.style.width = `${progressPercent}%`;

          // If progress reaches 100%, hide the overlay
          if (progressPercent >= 100) {
            setTimeout(() => {
              loadingOverlay.classList.add("hide");
            }, 500); // Short delay to ensure model has rendered
          }
        });

        // Handle any errors
        modelViewer.addEventListener("error", (error) => {
          console.error("Error loading model:", error);
          loadingOverlay.innerHTML =
            "<p>Error loading model. Please try again later.</p>";
        });

        // Track AR button clicks
        const arButton = document.getElementById("ar-button");
        if (arButton) {
          arButton.addEventListener("click", () => {
            console.log("AR button clicked");
          });
        }

        // Listen for AR mode changes
        modelViewer.addEventListener("ar-status", (event) => {
          console.log("AR status:", event.detail.status);
          if (event.detail.status === "session-started") {
            arStatus.textContent = "AR session started!";
          } else if (event.detail.status === "not-presenting") {
            arStatus.textContent = "AR session ended";
          } else if (event.detail.status === "failed") {
            arStatus.textContent =
              "AR session failed to start: " +
              (event.detail.statusMessage || "Unknown error");
          }
        });

        // Fallback: If the model is loaded but overlay still shows after 5 seconds
        setTimeout(() => {
          if (!loadingOverlay.classList.contains("hide")) {
            loadingOverlay.classList.add("hide");
          }
        }, 5000);
      });
    </script>
  </body>
</html>
